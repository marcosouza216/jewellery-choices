name: Sync Images From Supabase

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets exist
        run: |
          test -n "${{ secrets.SUPABASE_URL }}"
          test -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          echo "Supabase secrets are configured."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Precheck Supabase PATCH connectivity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          
          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Accept": "application/json",
              "Content-Type": "application/json",
              "Prefer": "return=representation",
          }
          
          # Read one product row
          get_req = urllib.request.Request(
              f"{base}/rest/v1/products?select=id,image&order=id.asc&limit=1",
              headers=headers,
          )
          with urllib.request.urlopen(get_req, timeout=30) as resp:
              rows = json.loads(resp.read().decode("utf-8"))
          
          if not rows:
              print("No products found. Skip PATCH precheck.")
              raise SystemExit(0)
          
          row = rows[0]
          pid = row["id"]
          image_value = row.get("image", "")
          
          # Do a no-op PATCH (write same value back)
          patch_req = urllib.request.Request(
              f"{base}/rest/v1/products?id=eq.{pid}",
              data=json.dumps({"image": image_value}, ensure_ascii=False).encode("utf-8"),
              method="PATCH",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(patch_req, timeout=30) as resp:
                  _ = resp.read()
          except urllib.error.HTTPError as e:
              if e.code in (301, 302, 307, 308):
                  redirected = e.headers.get("Location")
                  if redirected:
                      redirected = urllib.parse.urljoin(f"{base}/rest/v1/products?id=eq.{pid}", redirected)
                      print(f"PATCH precheck redirect -> {redirected}")
                      redirected_req = urllib.request.Request(
                          redirected,
                          data=json.dumps({"image": image_value}, ensure_ascii=False).encode("utf-8"),
                          method="PATCH",
                          headers=headers,
                      )
                      with urllib.request.urlopen(redirected_req, timeout=30) as resp:
                          _ = resp.read()
                  else:
                      raise
              else:
                  raise
          
          print(f"PATCH precheck passed on product id={pid}")
          PY

      - name: Sync images and rewrite DB URLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: product-images
          IMAGES_DIR: image
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          GITHUB_REPOSITORY: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/sync_supabase_images_to_github.py

      - name: Commit and push synced images
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add image
            git commit -m "chore: sync product images from supabase"
            git push
          else
            echo "No new images to commit."
          fi
